[General]
Enabled=1
; 0 = favorites only (default); 1 = all carried items. Magic stays favorites only.
AllInventory=0
; 1 = skip empty item categories (default); 0 = show all eight types.
HideEmptyCategories=1
; Keep open after equipment/magic/actions; potions and food always close.
; Enabled by default. 0 restores automatic closing for every use.
KeepOpen=1
; 0 = pause (default), 1 = slow time, 2 = unchanged game speed.
TimeMode=0
; Relative speed while slow-time wheel is open, 5..100 percent.
SlowTimePercent=20
; Language files: SKSE/Plugins/FavoriteWheel/Languages/*.ini
; auto = Windows display language; unavailable translations fall back to English.
Language=auto

[Controls]
; -1 = follow the vanilla Favorites binding (normally Q).
; Otherwise use a DirectInput keyboard scan code (Q = 16).
Hotkey=-1
; Modifier bits: None=0, Shift=1, Ctrl=2, Alt=4; combinations sum the bits.
; Chords match exactly. ActionHotkey=-1 follows the effective favorites key.
HotkeyModifier=0
ActionHotkey=-1
ActionModifier=1
; Controller keys use SKSE codes 266..281. -1 follows game for the main key,
; or means no modifier. Default action chord is LB + controller Favorites.
GamepadHotkey=-1
GamepadModifier=-1
GamepadActionModifier=274
; 0: LB/RB categories and LT/RT left/right use. 1: swap the pairs.
; D-Pad Up/Down always changes item pages; A/X remain use/manage.
GamepadCategoryButtons=0
; Optional: left stick moves freely in Slow/Normal modes; right stick selects.
; Pause/settings/dialogs block movement. Right stick also controls dialog pointers.
GamepadMoveWhileOpen=0
; R switches wheel mode while open.
SwitchWheelKey=19
SensitivityPercent=100

[Display]
ScalePercent=100
WheelScalePercent=100
PositionXPercent=72
PositionYPercent=46
OverlayOpacityPercent=35
ShowHints=1
Theme=classic
; Optional local TrueType/OpenType font; do not put quotes around the path.
Font=C:/Windows/Fonts/msyh.ttc

[Effects]
Sounds=1
Animations=1
