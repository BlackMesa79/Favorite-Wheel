[General]
Enabled=1
; Language files: SKSE/Plugins/FavoriteWheel/Languages/*.ini
; auto = Windows display language; unavailable translations fall back to English.
Language=auto

[Controls]
; -1 = follow the vanilla Favorites binding (normally Q).
; Otherwise use a DirectInput keyboard scan code (Q = 16).
Hotkey=-1
; R switches wheel mode while open. Shift + Favorites opens the function wheel.
SwitchWheelKey=19
SensitivityPercent=100

[Display]
ScalePercent=100
WheelScalePercent=100
PositionXPercent=28
PositionYPercent=46
OverlayOpacityPercent=35
ShowHints=1
Theme=classic
; Optional local TrueType/OpenType font; do not put quotes around the path.
Font=C:/Windows/Fonts/msyh.ttc

[Effects]
Sounds=1
Animations=1
